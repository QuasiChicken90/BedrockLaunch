<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launcher | Explore</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/launcherfiles/resources/CSS/global.css">
  </head>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * {
      font-family: 'Inter', sans-serif;
      -ms-user-select: none;
      -webkit-user-drag: none;
      -khtml-user-drag: none;
      -moz-user-drag: none;
      -ms-user-drag: none;
      -webkit-user-drag: none;
      -moz-user-drag: none;
      -ms-user-drag: none;
    }

    body {
      margin: 0;
      padding: 0;
      background: #1e1e1e;
      overflow-y: scroll;
      -ms-overflow-style: none;
      user-select: none;
      -ms-user-select: none;
      -webkit-user-drag: none;
      -khtml-user-drag: none;
      -moz-user-drag: none;
      -ms-user-drag: none;
      -webkit-user-drag: none;
      -moz-user-drag: none;
      -ms-user-drag: none;
    }

    body::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    html,
    body {
      background: transparent;
    }

    .LauncherContainer {
      width: 100%;
      height: 100vh;
    }

    .ExploreMenu {
      position: absolute;
      top: 10%; 
      left: 27%;
      width: 50%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      box-sizing: border-box;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.03) 100%);
      box-shadow: 0px 4px 30px rgba(0, 0, 0, 0.25),
        inset 1px 1px 2px rgba(255, 255, 255, 0.3),
        inset -1px -1px 2px rgba(87, 87, 87, 0.5);
      backdrop-filter: blur(15px);
      border-radius: 200px;
      z-index: 9000;
    }

    .tab-group {
      display: flex;
      gap: 10px;
    }

    .tab {
      color: white;
      font-size: 14px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 999px;
    }

    .tab:active {
      filter: opacity(60%)
    }

    .tab.active {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: saturate(150%);
      font-weight: 600;
    }

    .ExploreSearchBar input {
      background: rgba(0, 0, 0, 0.0);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 256px;
      padding: 8px 15px;
      color: white;
      outline: none;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
    }

    .ExploreSearchBar input:focus {
      border: 1px solid rgb(36, 69, 255);
      background: rgba(0, 0, 0, 0.0);
    }

    .ExploreSearchBar input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .ContentContainer {
      position: absolute;
      top: 17%;
      left: 27%;
      width: 50%;
      padding-bottom: 50px;
    }

    .AddonsContainer {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px 25px;
    }

    .placeholder-text {
      color: rgba(255, 255, 255, 0.5);
      text-align: center;
      margin-top: 50px;
      font-size: 1.2rem;
      font-weight: 400;
    }

    .AddonCard {
      width: 100%;
      height: 320px;
      background: linear-gradient(135deg, rgba(228, 228, 228, 0.05) 0%, rgba(206, 206, 206, 0.1) 100%);
      box-shadow: 0px 4px 30px rgba(0, 0, 0, 0.25),
        inset 1px 1px 2px rgba(255, 255, 255, 0.3),
        inset -1px -1px 2px rgba(87, 87, 87, 0.5);
      backdrop-filter: blur(32px);
      border-radius: 25px;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 10px;
      box-sizing: border-box;
      overflow: hidden;
      transition: 0.2s;
    }

    .AddonCard:active {
      transition: 0s !important;
      transform: scale(1.05);
      filter: brightness(140%) blur(1px);
      backdrop-filter: blur(7px);
    }

    .AddonCard img {
      width: 100%;
      height: 55%;
      border-radius: 16px;
      object-fit: cover;
      margin-bottom: 10px;
    }

    .AddonCard .no-image {
      width: 100%;
      height: 55%;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.2);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: rgba(255, 255, 255, 0.3);
    }

    .AddonCard h2 {
      font-size: 1.4rem;
      margin: 4px 0;
      margin-left: 8px;
    }

    .AddonCard h3 {
      font-size: 1rem;
      font-weight: 400;
      color: #ffffff;
      margin: 4px 0 8px 0;
      margin-left: 8px;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 10000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
      opacity: 0;
      transition: opacity 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .modal.show {
      opacity: 1;
    }

    .modal-content {
      position: absolute;
      right: -100%;
      top: 0;
      background: linear-gradient(135deg, rgba(228, 228, 228, 0.08) 0%, rgba(206, 206, 206, 0.12) 100%);
      box-shadow: -4px 0px 50px rgba(0, 0, 0, 0.5),
        inset 1px 1px 3px rgba(255, 255, 255, 0.3),
        inset -1px -1px 3px rgba(87, 87, 87, 0.5);
      padding: 30px;
      box-sizing: border-box;
      border-radius: 25px 0 0 25px; 
      width: 45%; 
      min-width: 400px;
      height: 100vh; 
      overflow-y: auto;
      color: white;
      backdrop-filter: blur(20px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .modal.show .modal-content {
      right: 0;
      filter: blur(0px);
    }

    .modal.closing .modal-content {
      right: -100%; 
      filter: blur(20px);
    }

    .modal-content::-webkit-scrollbar {
      width: 0px;
    }

    .download-btn {
      width: 100%;
      height: 60px;
      margin-bottom: 20px;
      border: none;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
      box-shadow: 0px 4px 30px rgba(0, 0, 0, 0.25),
        inset 1px 1px 2px rgba(255, 255, 255, 0.3),
        inset -1px -1px 2px rgba(87, 87, 87, 0.5);
      backdrop-filter: blur(15px);
      border-radius: 256px;
      font-weight: 700;
      font-size: 20px;
      color: white;
    }

    .download-btn:active {
      background-color: rgba(37, 95, 255, 0.8);
    }

    .markdown-content { margin: 20px 0; line-height: 1.6; }
    .markdown-content h1, .markdown-content h2, .markdown-content h3 { color: white; margin-top: 20px; }
    hr { border-radius: 0.60em; opacity: 0.6; background-color: white; border: none; height: 1px;}
    .markdown-content code { background: rgba(0, 0, 0, 0.3); padding: 2px 6px; border-radius: 4px; font-family: 'Courier New', monospace; }
    .markdown-content pre { background: rgba(0, 0, 0, 0.3); padding: 15px; border-radius: 8px; overflow-x: auto; }
    .markdown-content a { color: #5cb3ff; text-decoration: none; pointer-events: none; cursor: default;}
  </style>
  <body>
    
    <div class="ExploreMenu">
      <div class="tab-group">
        <div class="tab" data-target="ServersContainer">Servers</div>
        <div class="tab active" data-target="AddonsContainer">Addons</div>
        <div class="tab" data-target="PacksContainer">Resource Packs</div>
      </div>
      <div class="ExploreSearchBar">
        <input type="text" placeholder="Search..." />
      </div>
    </div>

    <div id="ServersContainer" class="ContentContainer" style="display: none;">
      <h2 class="placeholder-text"><i class="fas fa-server"></i> Servers content coming soon...</h2>
    </div>

    <div id="AddonsContainer" class="ContentContainer AddonsContainer"></div>

    <div id="PacksContainer" class="ContentContainer" style="display: none;">
      <h2 class="placeholder-text"><i class="fas fa-box-open"></i> Resource Packs coming soon...</h2>
    </div>

    <div id="addonModal" class="modal">
      <div class="modal-content">
        <button id="downloadBtn" class="download-btn">
          <i class="fas fa-download"></i> Install Pack
        </button>
        <div id="modalContent" class="markdown-content"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
      (function() {
        const tabs = document.querySelectorAll('.tab');
        const containers = document.querySelectorAll('.ContentContainer');

        tabs.forEach(tab => {
          tab.addEventListener('click', () => {
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');

            containers.forEach(c => c.style.display = 'none');

            const targetId = tab.getAttribute('data-target');
            const targetContainer = document.getElementById(targetId);
            
            if (targetContainer) {
              if (targetId === 'AddonsContainer') {
                targetContainer.style.display = 'grid'; 
              } else {
                targetContainer.style.display = 'block'; 
              }
            }
          });
        });

        const addonModal = document.getElementById('addonModal');
        const modalContent = document.getElementById('modalContent');
        const downloadBtn = document.getElementById('downloadBtn');

        window.onclick = function(event) {
          if (event.target == addonModal) {
            closeModal();
          }
        }

        function closeModal() {
          addonModal.classList.add('closing');
          addonModal.classList.remove('show');
          
          setTimeout(() => {
            addonModal.style.display = 'none';
            addonModal.classList.remove('closing');
          }, 300);
        }

        async function showAddonInfo(addonId, infoUrl) {
          await new Promise(resolve => setTimeout(resolve, 150));
          try {
            const response = await fetch(infoUrl);
            const markdown = await response.text();
            modalContent.innerHTML = marked.parse(markdown);
            downloadBtn.onclick = () => installAddon(addonId);
            
            addonModal.style.display = 'block';
            addonModal.offsetHeight; 
            
            requestAnimationFrame(() => {
              addonModal.classList.add('show');
            });
          } catch (error) {
            console.error('Error loading addon info:', error);
            modalContent.innerHTML = '<p>Error loading addon information.</p>';
            addonModal.style.display = 'block';
            requestAnimationFrame(() => {
              addonModal.classList.add('show');
            });
          }
        }

        function installAddon(addonId) {
          fetch(`/launcher/api/addons/installaddon/${addonId}`)
            .then(response => response.text())
            .then(text => {
              if (text === 'OK') {
                alert('Addon installed!');
              }
            })
            .catch(error => console.error('Error installing addon:', error));
        }

        async function loadAddons() {
          try {
            const response = await fetch('https://raw.githubusercontent.com/QuasiChicken90/BedrockLaunch/refs/heads/main/Addons/AddonDB.yml');
            const yamlText = await response.text();

            const addons = parseYAML(yamlText);
            const container = document.getElementById('AddonsContainer');
            
            Object.keys(addons).forEach(key => {
              const addon = addons[key];
              if (!addon.Name) return;
              
              const card = document.createElement('div');
              card.classList.add('AddonCard');
              
              const imageHTML = addon.Image && addon.Image !== 'None' 
                ? `<img src="${addon.Image}" alt="${addon.Name}">`
                : `<div class="no-image"><i class="fas fa-puzzle-piece"></i></div>`;
              
              card.innerHTML = `
                ${imageHTML}
                <h2>${addon.Name}</h2>
                <h3>by ${addon.Author}</h3>
              `;
              
              card.onclick = () => showAddonInfo(key, addon.InfoMarkdown);
              container.appendChild(card);
            });
          } catch (error) {
            console.error('Error loading addons:', error);
          }
        }

        function parseYAML(yamlText) {
          const addons = {};
          const lines = yamlText.split('\n');
          let currentKey = null;
          let currentAddon = {};
          
          lines.forEach(line => {
            line = line.trim();
            if (!line || line.startsWith('#')) return;
            
            if (/^"?\d+"?:$/.test(line)) {
              if (currentKey !== null) {
                addons[currentKey] = currentAddon;
              }
              currentKey = line.replace(':', '');
              currentAddon = {};
            } else if (line.includes(':')) {
              const [key, ...valueParts] = line.split(':');
              const value = valueParts.join(':').trim().replace(/^["']|["']$/g, '');
              currentAddon[key.trim()] = value;
            }
          });
          
          if (currentKey !== null) {
            addons[currentKey] = currentAddon;
          }
          
          return addons;
        }

        loadAddons();
      })();
    </script>
  </body>
</html>
