<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launcher | addons</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/launcherfiles/resources/CSS/global.css">
  </head>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * {
      font-family: 'Inter', sans-serif;
      -ms-user-select: none;
      -webkit-user-drag: none;
      -khtml-user-drag: none;
      -moz-user-drag: none;
      -ms-user-drag: none;
      -webkit-user-drag: none;
      -moz-user-drag: none;
      -ms-user-drag: none;
    }

    body {
      margin: 0;
      padding: 0;
      background: #1e1e1e;
      overflow-y: scroll;
      -ms-overflow-style: none;
      user-select: none;
      -ms-user-select: none;
      -webkit-user-drag: none;
      -khtml-user-drag: none;
      -moz-user-drag: none;
      -ms-user-drag: none;
      -webkit-user-drag: none;
      -moz-user-drag: none;
      -ms-user-drag: none;
    }

    body::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    html,
    body {
      background: transparent;
    }

    .LauncherContainer {
      width: 100%;
      height: 100vh;
    }

    .btnPlay {
      position: absolute;
      width: 352px;
      height: 91px;
      border: none;
      background: linear-gradient(135deg, rgba(228, 228, 228, 0.01) 100%, rgba(206, 206, 206, 0.01) 0%);
      box-shadow: 0px 4px 49.7px 1px rgba(0, 0, 0, 0.25), inset 1px 1px 2px rgba(255, 255, 255, 0.3), inset -1px -1px 2px rgba(87, 87, 87, 0.5);
      backdrop-filter: blur(12px);
      border-radius: 256px;
      font-weight: 900;
      font-size: 27px;
      color: white;
      bottom: 10%;
      left: 62%;
      transform: translate(-50%, 0);
    }

    .btnPlay i {
      font-size: 32px;
      color: white;
    }

    .btnPlay:active {
      background-color: rgb(37, 95, 255, 0.5);
    }

    .addons {
      position: fixed;
      top: 1%;
      left: 30%;
      color: white;
      font-size: 30px;
      font-weight: 700;
      z-index: 9999;
    }

    .AddonsContainer {
      position: absolute;
      top: 10%;
      left: 27%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px 25px;
      width: 50%;
    }

    .AddonCard {
      width: 100%;
      height: 320px;
      background: linear-gradient(135deg, rgba(228, 228, 228, 0.05) 0%, rgba(206, 206, 206, 0.1) 100%);
      box-shadow: 0px 4px 30px rgba(0, 0, 0, 0.25),
        inset 1px 1px 2px rgba(255, 255, 255, 0.3),
        inset -1px -1px 2px rgba(87, 87, 87, 0.5);
      backdrop-filter: blur(32px);
      border-radius: 25px;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 10px;
      box-sizing: border-box;
      overflow: hidden;
      transition: 0.2s;
    }

    .AddonCard:active {
      transition: 0s !important;
      transform: scale(1.05);
      filter: brightness(140%) blur(1px);
      backdrop-filter: blur(7px);
    }

    .AddonCard img {
      width: 100%;
      height: 55%;
      border-radius: 16px;
      object-fit: cover;
      margin-bottom: 10px;
    }

    .AddonCard .no-image {
      width: 100%;
      height: 55%;
      border-radius: 16px;
      background: #1e1e1e;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: rgba(255, 255, 255, 0.3);
    }

    .AddonCard h2 {
      font-size: 1.4rem;
      margin: 4px 0;
      margin-left: 8px;
    }

    .AddonCard h3 {
      font-size: 1rem;
      font-weight: 400;
      color: #ffffff;
      margin: 4px 0 8px 0;
      margin-left: 8px;
    }

    .AddonCard h4 {
      font-size: 0.9rem;
      font-weight: 300;
      background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
      margin-left: 8px;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 10000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(60px);
      opacity: 0;
      transition: opacity 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .modal.show {
      opacity: 1;
    }

    .modal-content {
      position: absolute;
      left: 50%;
      top: 100%;
      transform: translateX(-50%) translateX(22.5%);
      background: linear-gradient(135deg, rgba(228, 228, 228, 0.08) 0%, rgba(206, 206, 206, 0.12) 100%);
      box-shadow: 0px 4px 50px rgba(0, 0, 0, 0.5),
        inset 1px 1px 3px rgba(255, 255, 255, 0.3),
        inset -1px -1px 3px rgba(87, 87, 87, 0.5);
      padding: 30px;
      border-radius: 25px;
      width: 60%;
      max-width: 800px;
      max-height: 80vh;
      overflow-y: auto;
      color: white;
      filter: blur(20px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .modal.show .modal-content {
      top: 5%;
      filter: blur(0px);
    }

    .modal.closing .modal-content {
      top: 100%;
      filter: blur(20px);
    }

    .modal-content::-webkit-scrollbar {
      width: 0px;
    }

    .modal-content::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.0);
      border-radius: 10px;
    }

    .modal-content::-webkit-scrollbar-thumb {
      border-radius: 10px;
    }

    .download-btn {
      width: 100%;
      height: 60px;
      margin-bottom: 20px;
      border: none;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.1) 100%);
      box-shadow: 0px 4px 30px rgba(0, 0, 0, 0.25),
        inset 1px 1px 2px rgba(255, 255, 255, 0.3),
        inset -1px -1px 2px rgba(87, 87, 87, 0.5);
      backdrop-filter: blur(15px);
      border-radius: 256px;
      font-weight: 700;
      font-size: 20px;
      color: white;
    }

    .download-btn:active {
      background-color: rgb(37, 95, 255, 1);
    }

    .markdown-content {
      margin: 20px 0;
      line-height: 1.6;
    }

    .markdown-content h1,
    .markdown-content h2,
    .markdown-content h3 {
      color: white;
      margin-top: 20px;
    }

    hr {
      border-radius: 0.60em;
      opacity: 0.6;
      background-color: white;
    }

    .markdown-content code {
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
    }

    .markdown-content pre {
      background: rgba(0, 0, 0, 0.3);
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
    }

    .markdown-content a {
      color: #5cb3ff;
      text-decoration: none;
    }

    .markdown-content a:hover {
      text-decoration: underline;
    }

.markdown-content a {
  pointer-events: none;
  cursor: default;
}
  </style>
  <body>
    
    <div id="AddonsContainer" class="AddonsContainer"></div>

    <div id="addonModal" class="modal">
      <div class="modal-content">
        <button id="downloadBtn" class="download-btn">
          <i class="fas fa-download"></i> Install Pack
        </button>
        <div id="modalContent" class="markdown-content"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
  (function() {
    const addonModal = document.getElementById('addonModal');
    const modalContent = document.getElementById('modalContent');
    const downloadBtn = document.getElementById('downloadBtn');


    window.onclick = function(event) {
      if (event.target == addonModal) {
        closeModal();
      }
    }

    function closeModal() {
      addonModal.classList.add('closing');
      addonModal.classList.remove('show');
      
      setTimeout(() => {
        addonModal.style.display = 'none';
        addonModal.classList.remove('closing');
      }, 600);
    }

    async function showAddonInfo(addonId, infoUrl) {

      await new Promise(resolve => setTimeout(resolve, 150));
      try {
        const response = await fetch(infoUrl);
        const markdown = await response.text();
        modalContent.innerHTML = marked.parse(markdown);
        downloadBtn.onclick = () => installAddon(addonId);
        
        addonModal.style.display = 'block';
        
        addonModal.offsetHeight;
        
        requestAnimationFrame(() => {
          addonModal.classList.add('show');
        });
      } catch (error) {
        console.error('Error loading addon info:', error);
        modalContent.innerHTML = '<p>Error loading addon information.</p>';
        addonModal.style.display = 'block';
        requestAnimationFrame(() => {
          addonModal.classList.add('show');
        });
      }
    }

    function installAddon(addonId) {
      fetch(`/launcher/api/addons/installaddon/${addonId}`)
        .then(response => response.text())
        .then(text => {
          if (text === 'OK') {
            alert('Addon installed!');
          }
        })
        .catch(error => console.error('Error installing addon:', error));
    }

    async function loadAddons() {
      try {
        const response = await fetch('https://raw.githubusercontent.com/QuasiChicken90/BedrockLaunch/refs/heads/main/Addons/AddonDB.yml');
        const yamlText = await response.text();

        const addons = parseYAML(yamlText);
        const container = document.getElementById('AddonsContainer');
        
        Object.keys(addons).forEach(key => {
          const addon = addons[key];
          if (!addon.Name) return;
          
          const card = document.createElement('div');
          card.classList.add('AddonCard');
          
          const imageHTML = addon.Image && addon.Image !== 'None' 
            ? `<img src="${addon.Image}" alt="${addon.Name}">`
            : `<div class="no-image"><i class="fas fa-puzzle-piece"></i></div>`;
          
          card.innerHTML = `
            ${imageHTML}
            <h2>${addon.Name}</h2>
            <h3>by ${addon.Author}</h3>
          `;
          
          card.onclick = () => showAddonInfo(key, addon.InfoMarkdown);
          container.appendChild(card);
        });
      } catch (error) {
        console.error('Error loading addons:', error);
      }
    }

    function parseYAML(yamlText) {
      const addons = {};
      const lines = yamlText.split('\n');
      let currentKey = null;
      let currentAddon = {};
      
      lines.forEach(line => {
        line = line.trim();
        if (!line || line.startsWith('#')) return;
        
        if (/^"?\d+"?:$/.test(line)) {
          if (currentKey !== null) {
            addons[currentKey] = currentAddon;
          }
          currentKey = line.replace(':', '');
          currentAddon = {};
        } else if (line.includes(':')) {
          const [key, ...valueParts] = line.split(':');
          const value = valueParts.join(':').trim().replace(/^["']|["']$/g, '');
          currentAddon[key.trim()] = value;
        }
      });
      
      if (currentKey !== null) {
        addons[currentKey] = currentAddon;
      }
      
      return addons;
    }

    loadAddons();
  })();
</script>
  </body>
</html>
