<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launcher | Settings</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/launcherfiles/resources/CSS/global.css">
</head>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * {
        font-family: 'Inter', sans-serif;
    }

    body {
        margin: 0;
        padding: 0;
        background: #1e1e1e;
    }

    body {
        overflow-y: scroll;
        -ms-overflow-style: none;
    }

    body::-webkit-scrollbar {
        width: 0;
        height: 0;
    }
    

    html, body {
        background: transparent;
    }
    
    .LauncherContainer {
        width: 100%;
        height: 100vh;
    }


.btnPlay {
    position: absolute;
    width: 352px;
    height: 91px;
    border: none;
    background: linear-gradient(135deg, rgba(228, 228, 228, 0.01) 100%, rgba(206, 206, 206, 0.01) 0%);
    box-shadow: 0px 4px 49.7px 1px rgba(0, 0, 0, 0.25), inset 1px 1px 2px rgba(255, 255, 255, 0.3), inset -1px -1px 2px rgba(87, 87, 87, 0.5);
    backdrop-filter: blur(4px);
    border-radius: 256px;
    font-weight: 900;
    font-size: 27px;
    color: white;

    /* positioning 😭😭😭😭😭😭😭😭😭😭😭😭😭😭😭 */
    bottom: 10%;
    left: 62%;
    transform: translate(-50%, 0);
    
    

}
.btnPlay i {
    font-size: 32px; 
    color: white;   
}

.btnPlay:active {
    background-color: rgb(37, 95, 255, 0.5);
}

.Library {
    position: fixed;
    top: 1%;
    left: 30%;
    color: white;
    font-size: 30px;
    font-weight: 700;
    z-index: 9999;
}

.btnUseVer {
    margin-left: 20px;
    padding: 10px 20px;
    background-color: rgb(255, 255, 255,0.1);
    color: white;
    font-weight: 500;
    border: none;
    border-radius: 256px;
}

.btnUseVer:active {
    background-color: rgb(37, 95, 255, 1);
}

    .VersionList {
      position: absolute;
      top: 15%;
      left: 30%;
      width: 60%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      z-index: 10;
    }

    .VersionContainer {
      flex: 1 1 45%;
      min-width: 300px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
        background: linear-gradient(135deg, rgba(228, 228, 228, 0.01) 100%, rgba(206, 206, 206, 0.01) 0%);
        box-shadow: 0px 4px 49.7px 1px rgba(0, 0, 0, 0.25), inset 1px 1px 2px rgba(255, 255, 255, 0.3), inset -1px -1px 2px rgba(87, 87, 87, 0.5);
        backdrop-filter: blur(7.5px);
      border-radius: 256px;
    }

    .VersionContainer h3 {
      font-weight: 600;
      font-size: 20px;
    }

    h3 {
        color: white;
    }

    .btnCreate {
        position: fixed;
        top: 3.5%;
        left: 85%;
        transform: translate(-50%, 0);
        width: 150px;
        height: 40px;
        background: linear-gradient(135deg, rgba(228, 228, 228, 0.01) 100%, rgba(206, 206, 206, 0.01) 0%);
        box-shadow: 0px 4px 49.7px 1px rgba(0, 0, 0, 0.25), inset 1px 1px 2px rgba(255, 255, 255, 0.3), inset -1px -1px 2px rgba(87, 87, 87, 0.5);
        backdrop-filter: blur(3.5px) saturate(2);
        color: white;
        font-weight: 500;
        border: none;
        border-radius: 256px;
        z-index: 9999;
    }



</style>

<script>

</script>

<body>



<div class="LauncherContainer">

</div>
    

    <!-- <button onclick="location.href = '/launcher/create'" class="btnCreate">Create</button> -->
     <button onclick="loadPage('create')" class="btnCreate">Create</button>

 <div class="VersionList">
        {% for version in versionList %}
            <div class="VersionContainer">
                <h3>{{ version.name }}</h3>
                <button onclick="alert('Set Version to {{ version.id }}');location.href = '/launcher/set/{{ version.id }}'" class="btnUseVer"><i class="fas fa-play"></i> Use</button>
            </div>
        {% endfor %}
  </div>

</body>
</html>
