<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launcher</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="http://localhost:21934/launcherfiles/resources/CSS/global.css">
  </head>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * {
      font-family: 'Inter', sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000000;
    }

    html, body {
      background: transparent;
    }

    .LauncherContainer {
      width: 100%;
      height: 100vh;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.6); filter: blur(8px); }
      to   { opacity: 1; transform: scale(1);   filter: blur(0);   }
    }

    .PageTitle {
      position: fixed;
      top: 1%;
      left: 27%;
      color: white;
      font-size: 30px;
      font-weight: 700;
      z-index: 9999;
    }

    .dropdownGroup {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 90%;         
    }

    .btnDropdownToggle {
      width: 100% !important;
    }

    .btnDropdownToggle .caret {
      margin-left: auto;
      margin-right: 4px;
      font-size: 0.7em;
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0.7;
    }

    .btnDropdownToggle.open .caret {
      transform: rotate(180deg);
    }

    .dropdownChildren {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.22s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity   0.18s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0;
      gap: 8px;
      padding-top: 0;
    }

    .dropdownChildren.open {
      max-height: 240px;
      opacity: 1;
      padding-top: 8px;   
    }

    .dropdownChildren button {
      width: 100% !important;
      height: 55px !important;
    }

    .notificationActivity {
  position: fixed;
  bottom: 20px;
  right: 20px;

  width: 280px;
  padding: 20px 22px;

  background: rgba(0, 0, 0, 0);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  border-radius: 30px;
  border: 1.5px solid rgba(0, 0, 0, 0.9);

  box-shadow:
    0 18px 50px rgba(0, 0, 0, 0.45),
    inset 0 0 0 1px rgb(53, 53, 53);

  display: flex;
  flex-direction: column;
  align-items: flex-start;
  text-align: left;

  height: auto;
  max-height: none;
  visibility: hidden;
}


.notificationActivity h4 {
  margin-bottom: 0px; 
}

    @keyframes move {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(400%);
      }
    }


        .progress-bar {
      width: 100%;
      max-width: 400px;
      height: 6px;
      background-color: #ffffff1e;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-fill {
      width: 30%;
      height: 100%;
      background: linear-gradient(90deg, #1e90ff, #007bff);
      border-radius: 3px;
      animation: move 1.5s linear infinite;
    }
  </style>
  <body>
    <h3 class="PageTitle">Home</h3>
    <div class="UpperDepthEffect pywebview-drag-region"></div>
    <div class="LauncherContainer">
      <video autoplay muted loop preload="metadata" id="video" class="LauncherVideo">
        <source src="{{ themePath }}" type="video/mp4"> Failed to load theme. Video not supported.
      </video>
      <div id="contentArea" style="opacity: 0; animation: fadeInExpand 0.8s ease-out forwards;"></div>
    </div>
    <div class="contentArea"></div>
    <div class="sideBar">
      <button class="btnActiveTab" data-page="Home">
        <i class="fas fa-home"></i>
        <span>Home</span>
      </button>
      <button class="btnInactiveTab" data-page="Library">
        <i class="fas fa-bars"></i>
        <span>Library</span>
      </button>
      <button class="btnInactiveTab" data-page="Explore">
        <i class="fas fa-compass"></i>
        <span>Explore</span>
      </button>

      <div class="dropdownGroup">
        <button class="btnInactiveTab btnDropdownToggle" id="contentToggle">
          <i class="fas fa-layer-group"></i>
          <span>Content</span>
          <i class="fas fa-chevron-down caret"></i>
        </button>
        <div class="dropdownChildren" id="contentChildren">
          <button class="btnInactiveTab" data-page="Worlds">
            <i class="fas fa-map"></i>
            <span>Worlds</span>
          </button>
          <button class="btnInactiveTab" data-page="Servers">
            <i class="fas fa-server"></i>
            <span>Servers</span>
          </button>
          <button class="btnInactiveTab" data-page="Screenshots">
            <i class="fas fa-panorama"></i>
            <span>Screenshots</span>
          </button>
        </div>
      </div>

      <button class="btnInactiveTab" data-page="Articles">
        <i class="fas fa-newspaper"></i>
        <span>Articles</span>
      </button>
      <button class="btnInactiveTab" data-page="Settings">
        <i class="fas fa-cog"></i>
        <span>Settings</span>
      </button>
    </div>
    <script>
      let isMouseDown = false;
      let dragMode = false;
      let holdTimeout = null;

      window.addEventListener('pywebviewready', () => { bridgeReady = true; });

      function minimize() {
        if (bridgeReady && window.pywebview && window.pywebview.api) {
          window.pywebview.api.minimize();
        }
      }

      const contentToggle   = document.getElementById('contentToggle');
      const contentChildren = document.getElementById('contentChildren');

      contentToggle.addEventListener('click', () => {
        const isOpen = contentChildren.classList.toggle('open');
        contentToggle.classList.toggle('open', isOpen);
      });

      const buttons = document.querySelectorAll('.sideBar button:not(.btnDropdownToggle)');
      buttons.forEach(button => {
        button.addEventListener('mousedown', e => {
          isMouseDown = true;
          dragMode = false;
          holdTimeout = setTimeout(() => { if (isMouseDown) dragMode = true; }, 500);
        });
        button.addEventListener('mouseup', e => {
          clearTimeout(holdTimeout);
          if (!dragMode) {
            const page = button.dataset.page;
            setActiveTab(button);
            loadPage(page);
          }
          isMouseDown = false;
          dragMode = false;
        });
        button.addEventListener('mouseenter', e => {
          if (isMouseDown && dragMode) {
            const page = button.dataset.page;
            setActiveTab(button);
            loadPage(page);
          }
        });
        button.addEventListener('mouseleave', () => {
          if (!event.buttons) {
            isMouseDown = false;
            dragMode = false;
            clearTimeout(holdTimeout);
          }
        });
      });

      function setActiveTab(activeButton) {
        document.querySelectorAll('.sideBar button').forEach(btn => {
          btn.classList.remove('btnActiveTab');
          btn.classList.add('btnInactiveTab');
        });
        activeButton.classList.remove('btnInactiveTab');
        activeButton.classList.add('btnActiveTab');



        const pageTitle = document.querySelector('.PageTitle');
        if (pageTitle) pageTitle.innerText = activeButton.innerText.trim();
      }

      function runInjectedScripts(container) {
        container.querySelectorAll('script').forEach(oldScript => {
          const newScript = document.createElement('script');
          for (const attr of oldScript.attributes) newScript.setAttribute(attr.name, attr.value);
          newScript.textContent = oldScript.src ? '' : oldScript.textContent;
          if (oldScript.src) newScript.src = oldScript.src;
          document.body.appendChild(newScript);
          oldScript.remove();
        });
      }

      const pageCache = {};
      async function loadPage(pageName) {
        const contentArea = document.getElementById('contentArea');
        if (!contentArea) return;
        const lowerPage = pageName.toLowerCase();
        contentArea.style.opacity = 0;
        if (pageCache[lowerPage]) {
          setTimeout(() => {
            contentArea.innerHTML = pageCache[lowerPage];
            runInjectedScripts(contentArea);
            contentArea.style.opacity = 1;
          }, 150);
          return;
        }
        try {
          const response = await fetch(`http://localhost:21934/launcher/${lowerPage}`);
          if (!response.ok) throw new Error('Failed to load page');
          const html = await response.text();
          contentArea.innerHTML = html;
          runInjectedScripts(contentArea);
          contentArea.style.opacity = 1;
          pageCache[lowerPage] = html;
        } catch (error) {
          console.error(error);
          contentArea.innerHTML = `<p style="color:red;">Failed to load ${pageName}</p>`;
          contentArea.style.opacity = 1;
        }
      }

      window.addEventListener('DOMContentLoaded', () => { loadPage('Home'); });
    </script>

    <div class="notificationActivity">
      <h4 style="color: white;">Title</h4>
      <p style="color: white;">Description</p>
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
    </div>


<script>
function checkDownloadStatus() {
  fetch('/launcher/api/create/getdownloadstatus')
    .then(response => response.text())
    .then(data => {
      const trimmedData = data.trim();

      if (trimmedData === 'Downloading') {
        const notification = document.querySelector('.notificationActivity');

        if (notification) {
          notification.style.visibility = 'visible';
          notification.querySelector('h4').textContent = 'Downloading Version';
          notification.querySelector('p').textContent = 'This might take a while';
        }
      }
        else if (trimmedData === 'NoDownload') {
          const notification = document.querySelector('.notificationActivity');
  
          if (notification) {
            notification.style.visibility = 'hidden';
            notification.querySelector('h4').textContent = '';
            notification.querySelector('p').textContent = '';
          }
        }
    })
    .catch(error => {
      console.error('Error:', error);
    });
}

// check every 3 seconds
setInterval(checkDownloadStatus, 1000);
</script>
  </body>
</html>
