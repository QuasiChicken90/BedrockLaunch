<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launcher | Screenshots</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');

    * {
      font-family: 'Inter', sans-serif;
      user-select: none;
      -webkit-user-drag: none;
    }

    body {
      margin: 0; padding: 0;
      background: transparent;
      overflow-y: scroll;
      -ms-overflow-style: none;
    }

    body::-webkit-scrollbar { width: 0; height: 0; }

    .ScreenshotsContainer {
      position: absolute;
      top: 10%; left: 27%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px 25px;
      width: 50%;
      padding-bottom: 30px;
    }

    .ScreenshotCard:active {
  transition: 0s !important;
  transform: scale(1.05);
  filter: brightness(140%) blur(1px);
}

    .ScreenshotCard {
      width: 100%;
      height: 220px;
      background: linear-gradient(135deg, rgba(228,228,228,0.05) 0%, rgba(206,206,206,0.1) 100%);
      box-shadow:
        0px 4px 30px rgba(0,0,0,0.25),
        inset 1px 1px 2px rgba(255,255,255,0.3),
        inset -1px -1px 2px rgba(87,87,87,0.5);
      backdrop-filter: blur(15px);
      border-radius: 25px;
      overflow: hidden;
      position: relative;
      transition: 0.2s;
    }

    .ScreenshotCard img {
      width: calc(100% - 20px);
      height: calc(100% - 20px);
      object-fit: cover;
      display: block;
      border-radius: 18px;
      margin: 10px;
    }

    .empty-state {
      color: rgba(255,255,255,0.4);
      font-size: 1rem;
      text-align: center;
      grid-column: span 2;
      padding: 60px 0;
    }
  </style>
</head>
<body>
  <div id="ScreenshotsContainer" class="ScreenshotsContainer"></div>

  <script>

      function onScreenshotsLoaded() {
        loadScreenshots();
    }

  </script>
  <script src="http://localhost:21934/launcherfiles/LauncherApi/JS/Screenshots.js" onload="onScreenshotsLoaded()"></script>
</body>
</html>
