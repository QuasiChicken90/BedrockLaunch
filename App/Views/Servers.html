        box-shadow: 0px 4px 49.7px 1px rgba(0, 0, 0, 0.25), inset 1px 1px 2px rgba(255, 255, 255, 0.3), inset -1px -1px 2px rgba(87, 87, 87, 0.5);

</script>

<body>



<div class="LauncherContainer">
    

    <button onclick="loadPage('servers')" class="btnReload">Refresh</button>

 <div class="ServerList">
  </div>

  <script>
        async function loadServers() {
    const container = document.querySelector(".ServerList");
    container.innerHTML = "<h1 style='color:white;'>Loading servers...</h1>";

    try {
        const res = await fetch("/launcher/api/servers/getlist");
        const servers = await res.json();

        container.innerHTML = ""; 

        servers.forEach(server => {
        const div = document.createElement("div");
        div.classList.add("ServerContainer");
        div.innerHTML = `
            <h3>${server.name}</h3>
            <h4>${server.ip}:${server.port}</h4>
            <h5>${server.online ? 
                `${server.players_online} online right now` : 
                "Offline"}</h5>
        `;
        container.appendChild(div);
        });

    } catch (err) {
        container.innerHTML = `<p style="color:red;">Failed to load servers: ${err}</p>`;
    }
    }
  </script>

  <script>

loadServers();
</script>

<style>
    .welcomeBox {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);

        border: none;

        backdrop-filter: blur(12px);

        transition: transform 0.3s, filter 0.3s, box-shadow 0.3s;

.whats-new-overlay {
    position: fixed;

    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.3);
    z-index: 10000;
    display: none;
    align-items: center;
    justify-content: center;
}

    .whats-new-overlay.show {
        display: flex;
    }

    .whats-new-overlay.fadeOut {
        display: none;
    }

.whats-new-container {
    background: rgba(28, 28, 30, 0.4);
    border-radius: 20px;
    padding: 32px 28px;

    max-height: 80vh;
    overflow-y: auto;
    position: relative;

    backdrop-filter: blur(20px);
}

    .whats-new-container.fadeOut {

    }

    .whats-new-container h1 {
        color: #ffffff;
        font-size: 24px;
        font-weight: 700;
        margin: 0 0 24px 0;
        opacity: 1;
        animation: none;
    }

    .feature-item {
        display: flex;

        gap: 16px;
        padding: 16px;
        border-radius: 12px;
        margin-bottom: 12px;
    }

        font-size: 20px;

    }

    .feature-text {

        font-size: 15px;

</style>

<div class="whats-new-overlay" id="whatsNewOverlay">
    <div class="whats-new-container" id="whatsNewPane">
        <h1>Warning</h1>
        
        <div class="feature-item">
            <div class="feature-icon">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <div class="feature-text">
                Does not support 1.21.120+ versions yet
            </div>
        </div>
        <button class="whats-new-continue-btn" onclick="closePrompt();">Continue</button>
    </div>
</div>

<!-- quick fix (warning msg) -->
<script>
    function showWhatsNew() {
        setTimeout(() => {
            const overlay = document.getElementById('whatsNewOverlay');
            overlay.classList.add('show');
        }, 300);
    }

    showWhatsNew()

    function closePrompt() {
        const overlay = document.getElementById('whatsNewOverlay');
        overlay.classList.add('fadeOut');
        
        setTimeout(() => {
            overlay.classList.remove('show');
        }, 500);
    }
</script>
