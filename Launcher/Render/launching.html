<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <title>launching</title>
  </head>
  <body>
    <style>
      body {
        background-color: #1e1e1e;
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
        margin: 0;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .NavToolbar {
        position: absolute;
        top: 0;
        width: 100%;
        height: 50px;
        z-index: 999;
        background: rgba(83, 83, 83, 0.1);
        border-bottom: 1px solid #000;
        backdrop-filter: blur(8px) saturate(150%);
        display: flex;
        justify-content: flex-end;
        align-items: center;
        user-select: none;
        padding-right: 15px;
        box-sizing: border-box;
        gap: 10px;
        -webkit-transform: translateZ(0);
        -webkit-backface-visibility: hidden;
        -webkit-perspective: 1000;
      }

      .NavSButtonActive {
        height: 48px;
        background: #0B75FF;
        border-width: 1px 0px;
        border-style: solid;
        border-color: rgba(255, 255, 255, 0.27);
        box-shadow: 0px 0px 0px 1px #000000;
        border-radius: 8px;
        width: 100%;
        color: #FFFFFF;
        font-weight: 600;
        font-size: large;
        text-align: left;
        padding-left: 24px;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .NavSButton {
        height: 48px;
        border-radius: 8px;
        width: 100%;
        color: #FFFFFF;
        font-weight: 600;
        font-size: large;
        text-align: left;
        padding-left: 24px;
        margin-bottom: 16px;
        background: none;
        border: none;
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .NavSButtonActive:active,
      .NavSButton:active {
        filter: brightness(0.5);
      }

      .NavTitle {
        color: #FFFFFF;
        font-weight: 700;
        font-size: large;
        text-align: left;
        padding-left: 24px;
        left: 350px;
        text-align: center;
      }

      .NavTButton {
        background: linear-gradient(180deg, rgba(39, 39, 39, 0.2) 0%, rgba(31, 31, 31, 0.1) 50.48%, rgba(39, 39, 39, 0.2) 100%);
        border-width: 1px 0px;
        border-style: solid;
        border-color: rgba(255, 255, 255, 0.13);
        box-shadow: 0px 0px 0px 0.5px #000000;
        backdrop-filter: blur(2.5px);
        border-radius: 64px;
        color: #FFFFFF;
        font-weight: 600;
        height: 35px;
        padding-left: 16px;
        padding-right: 16px;
      }

      .NavTButton.invisible {
        display: none;
      }

      .NavTButton:active {
        background: #0B75FF;
      }

      .LauncherLogs {
        width: calc(100%-150px);
        height: calc(70%-150px);
        ;
        color: white;
        border-radius: 10px;
        padding: 16px;
        box-sizing: border-box;
        overflow-y: auto;
        overflow-x: hidden;
        font-family: Consolas, "Courier New", monospace;
        font-size: 14px;
      }

      #logs {
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: 1.5;
      }
    </style>
    <div class="NavToolbar" id="NavToolbar" data-tauri-drag-region>
      <button onclick="location.href= '/'" class="NavTButton">
        <i class="fa-solid fa-chevron-left"></i> Back to launcher </button>
      <button id="minimize" class="NavTButton">
        <i class="fa-solid fa-minus"></i>
      </button>
      <button id="maximize" class="NavTButton">
        <i class="fa-regular fa-square"></i>
      </button>
      <button id="close" class="NavTButton">
        <i class="fa-solid fa-x"></i>
      </button>
    </div>
    <div class="LauncherLogs">
      <h1>Logs</h1>
      <p id="logs"></p>
    </div>
    <script>
      async function updateLogs() {
        try {
          const response = await fetch("http://localhost:21934/api/play/getlogs");
          const logs = await response.text();
          document.getElementById("logs").textContent = logs;
          const container = document.querySelector(".LauncherLogs");
          container.scrollTop = container.scrollHeight;
        } catch (error) {
          document.getElementById("logs").textContent = "Failed to fetch logs: " + error;
        }
        setTimeout(updateLogs, 100);
      }
      updateLogs();
    </script>
    <script type="module">
      import {
        getCurrentWindow
      } from "https://esm.sh/@tauri-apps/api@2/window";
      const win = getCurrentWindow();
      document.getElementById("minimize").onclick = () => {
        win.minimize();
      };
      document.getElementById("maximize").onclick = () => {
        win.toggleMaximize();
      };
      document.getElementById("close").onclick = () => {
        win.close();
      };
    </script>
    <script>
      const appWindow = window.__TAURI__.window.getCurrentWindow();
      const toolbar = document.getElementById("NavToolbar");
      toolbar.addEventListener("mousedown", async (e) => {
        if (e.button !== 0) return;
        if (e.target.closest("button")) return;
        await appWindow.startDragging();
      });
    </script>
  </body>
</html>
